name: Security and compatibility

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BUILD_STEP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: npm install --global pnpm@10.34.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm test-unit
      - run: pnpm test:security
      - run: pnpm build
      - run: pnpm exec tsc --noEmit
      - name: Build the production container without publishing
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag xlog:security-check .
      - name: Verify the production container runtime
        run: docker run --rm --entrypoint node xlog:security-check --version
